[package]
name = "grammar-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Harper 3.0.0 with archive security fixes; see ../CONTRIBUTING.md.
harper-core = { git = "https://github.com/PhilipSchmid/harper", rev = "ae6acb45fd6cf10708728bb9e82289dea38154df" }
swift-bridge = "0.1.59"
uuid = { version = "1.0", features = ["v4"] }
whatlang = "0.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

[build-dependencies]
swift-bridge-build = "0.1.59"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[lints.clippy]
# Default lints - use sensible defaults without pedantic for now
# Specific allows for FFI code and generated swift-bridge code
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"  # FFI functions need many parameters
unnecessary_cast = "allow"     # swift-bridge generates these
