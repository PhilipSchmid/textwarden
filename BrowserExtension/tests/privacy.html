<!doctype html>
<html lang="en"><meta charset="utf-8"><title>TextWarden field privacy fixture</title>
<style>body{font:18px system-ui;max-width:760px;margin:35px auto;color-scheme:light dark}label{display:block;margin:20px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit}button{font:inherit;margin:6px}section{border:1px solid #888;padding:16px;margin:20px 0}</style>
<h1>Sensitive-field protection</h1><p>Synthetic test data only. Sensitive fields must have no TextWarden underlines or pill.</p>
<label>Ordinary writing<textarea id="message">We has reviewed the report.</textarea></label>
<section><label>Password<input id="password" type="password" value="synthetic-only" spellcheck="true"></label><button id="reveal">Show password</button></section>
<label>One-time code<input autocomplete="one-time-code" value="000000" spellcheck="true"></label>
<label>PIN<input name="pin" inputmode="numeric" value="0000" spellcheck="true"></label>
<label>Card number<input autocomplete="cc-number" value="0000 0000 0000 0000" spellcheck="true"></label>
<label>API key<input name="api_key" value="synthetic-only" spellcheck="true"></label>
<label>Dynamic writing field<input id="dynamic" value="We has reviewed the report." spellcheck="true"></label><button id="protect">Make dynamic field sensitive</button>
<script>document.querySelector('#reveal').onclick=()=>{const f=document.querySelector('#password');f.type=f.type==='password'?'text':'password';f.focus()};document.querySelector('#protect').onclick=()=>{const f=document.querySelector('#dynamic');f.autocomplete='one-time-code';f.focus()};</script></html>
